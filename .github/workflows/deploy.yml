name: Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy
        required: false
        type: string
  workflow_run:
    workflows: ["Build"]
    types:
      - completed

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-west-2
      CLUSTER_NAME: m2-prod-7xjh33
      NAMESPACE: prj-txpipe-773981
      FRONTEND_NAME: aromatic-relation-1sduph
      ROLE_ARN: arn:aws:iam::295114534192:role/docs-deployer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: image
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.image_tag }}" ]; then
            echo "tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-docs-deploy

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        shell: bash
        run: aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"

      - name: Patch frontend image
        shell: bash
        run: |
          kubectl patch frontend "$FRONTEND_NAME" \
            -n "$NAMESPACE" \
            --type merge \
            -p "{\"spec\":{\"image\":\"ghcr.io/txpipe/docs:${{ steps.image.outputs.tag }}\"}}"
